<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PT Tracker">
  <title>PT Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.263.1/lucide.min.css">
  <style>
    body {
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body class="bg-gray-900 text-white">
  <div id="app">
    <div class="min-h-screen bg-gray-900 flex items-center justify-center">
      <div class="text-gray-400">Loading...</div>
    </div>
  </div>

  <script>
    const APP_VERSION = 'v1.1-daily-reset';
    
    // Storage utilities
    const storage = {
      save: (key, value) => {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (e) {
          console.error('Storage error:', e);
          return false;
        }
      },
      load: (key) => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : null;
        } catch (e) {
          console.error('Load error:', e);
          return null;
        }
      }
    };

    // State management
    let state = {
      currentPage: 'today',
      exercises: storage.load('pt-exercises') || [],
      completions: storage.load('pt-completions') || {},
      lastResetDate: storage.load('pt-last-reset') || null,
      collapsedCategories: {},
      showAddModal: false,
      editingExercise: null,
      newExercise: {
        name: '',
        reps: '',
        description: '',
        days: [],
        sets: 1,
        bodyPart: 'Upper Body',
        icon: ''
      }
    };

    const bodyPartOptions = ['Upper Body', 'Lower Body', 'Abs', 'Wrist', 'Knee', 'Neck', 'Glutes'];
    const daysOfWeek = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    function checkAndResetDailyData() {
      const now = new Date();
      const todayDate = now.toISOString().split('T')[0];
      const twoAM = new Date();
      twoAM.setHours(2, 0, 0, 0);

      let effectiveResetDay = todayDate;
      if (now < twoAM) {
        const yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        effectiveResetDay = yesterday.toISOString().split('T')[0];
      }

      if (state.lastResetDate !== effectiveResetDay) {
        state.completions = {}; 
        state.lastResetDate = effectiveResetDay;
        storage.save('pt-completions', {});
        storage.save('pt-last-reset', effectiveResetDay);
      }
    }

    function setState(updates) {
      state = { ...state, ...updates };
      render();
    }

    function saveExercises(exercises) {
      storage.save('pt-exercises', exercises);
      setState({ exercises });
    }

    function saveCompletions(completions) {
      storage.save('pt-completions', completions);
      setState({ completions });
    }

    function getDateKey() {
      return new Date().toISOString().split('T')[0];
    }

    function getTodayShort() {
      return new Date().toLocaleDateString('en-US', { weekday: 'short' });
    }

    function getToday() {
      return new Date().toLocaleDateString('en-US', { 
        weekday: 'long', 
        month: 'short', 
        day: 'numeric' 
      }).toUpperCase();
    }

    function getTodaysExercises() {
      const todayShort = getTodayShort();
      return state.exercises.filter(ex => ex.days.includes(todayShort));
    }

    function groupByBodyPart(exercises) {
      const grouped = {};
      exercises.forEach(ex => {
        const part = ex.bodyPart || 'Other';
        if (!grouped[part]) grouped[part] = [];
        grouped[part].push(ex);
      });
      return grouped;
    }

    function getCompletedSets(exerciseId) {
      return state.completions[`${exerciseId}-${getDateKey()}`] || 0;
    }

    function toggleComplete(exerciseId, totalSets) {
      const key = `${exerciseId}-${getDateKey()}`;
      const current = state.completions[key] || 0;
      const next = (current + 1) % (totalSets + 1);
      
      const newCompletions = { ...state.completions };
      if (next === 0) {
        delete newCompletions[key];
      } else {
        newCompletions[key] = next;
      }
      saveCompletions(newCompletions);
    }

    function addExercise() {
      const { newExercise, editingExercise, exercises } = state;
      
      if (!newExercise.name || !newExercise.reps || (newExercise.days.length === 0 && !newExercise.shelved)) {
        alert('Please fill in all required fields');
        return;
      }

      if (editingExercise) {
        const updated = exercises.map(ex =>
          ex.id === editingExercise.id
            ? { ...newExercise, id: editingExercise.id, reps: parseInt(newExercise.reps), shelved: newExercise.shelved || false, icon: newExercise.icon }
            : ex
        );
        saveExercises(updated);
      } else {
        const exercise = {
          id: Date.now(),
          ...newExercise,
          reps: parseInt(newExercise.reps),
          shelved: newExercise.shelved || false,
          icon: newExercise.icon
        };
        saveExercises([...exercises, exercise]);
      }

      setState({
        showAddModal: false,
        editingExercise: null,
        newExercise: {
          name: '', reps: '', description: '', days: [], sets: 1, bodyPart: 'Upper Body', icon: ''
        }
      });
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = renderApp();
      attachEventListeners();
    }

    function renderApp() {
      const { currentPage, showAddModal } = state;
      return `
        <div class="min-h-screen bg-gray-900 text-white pb-24">
          ${renderHeader()}
          <div class="px-6">
            ${showAddModal ? renderAddModal() : renderPage(currentPage)}
          </div>
          ${renderBottomNav()}
        </div>
      `;
    }

    function renderHeader() {
      return `
        <div class="p-6 flex items-center gap-4">
         <div class="w-16 h-16 bg-orange-500 rounded-2xl flex items-center justify-center shadow-lg">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 512 512" fill="white">
            <path d="M 433.500 32.913 C 431.300 33.942, 425.455 38.886, 420.512 43.901 L 411.524 53.018 435.253 76.747 L 458.982 100.476 468.099 91.488 C 480.572 79.192, 483.124 73.068, 479.461 64.218 C 477.428 59.306, 453.761 35.378, 448.500 32.916 C 443.423 30.540, 438.580 30.539, 433.500 32.913 M 356.446 37.472 C 353.392 38.998, 347.296 44.165, 340.509 50.980 L 329.518 62.016 389.751 122.249 L 449.984 182.482 461.020 171.491 C 474.260 158.306, 477.004 153.590, 476.990 144.054 C 476.973 132.248, 476.994 132.274, 427.852 83.291 C 394.415 49.962, 382.393 38.585, 379 37.063 C 372.395 34.100, 362.848 34.273, 356.446 37.472 M 282.067 39.144 C 278.463 40.202, 253.481 63.765, 247.868 71.400 C 244.507 75.971, 243.954 82.972, 246.634 87.027 C 248.986 90.588, 418.738 260.634, 423.400 264.100 C 426.406 266.335, 428.377 267, 432 267 C 438.157 267, 440.901 264.937, 458.158 247.332 C 473.010 232.181, 474.923 228.910, 472.997 221.968 C 472.238 219.234, 453.023 199.495, 382.254 128.750 C 332.875 79.387, 291.805 38.994, 290.987 38.986 C 290.169 38.979, 288.600 38.784, 287.500 38.554 C 286.400 38.324, 283.955 38.589, 282.067 39.144 M 232.242 232.258 L 159.995 304.510 183.752 328.253 L 207.510 351.995 279.758 279.742 L 352.005 207.490 328.248 183.747 L 304.490 160.005 232.242 232.258 M 71.400 247.868 C 69.255 249.445, 61.354 257.005, 53.842 264.668 C 38.967 279.843, 37.035 283.150, 39.016 290.055 C 40.496 295.216, 216.972 471.624, 222.032 472.999 C 228.970 474.886, 232.201 472.990, 247.346 458.144 C 264.726 441.107, 267 438.115, 267 432.284 C 267 429.856, 266.503 426.886, 265.896 425.684 C 264.329 422.582, 90.068 248.173, 86.800 246.436 C 82.230 244.006, 75.845 244.600, 71.400 247.868 M 50.231 341.310 C 37.316 354.399, 35.044 358.393, 35.044 368 C 35.044 379.513, 34.773 379.177, 83.291 427.852 C 132.274 476.994, 132.248 476.973, 144.054 476.990 C 153.590 477.004, 158.306 474.260, 171.490 461.021 L 182.480 449.986 122.493 389.993 C 89.500 356.997, 62.255 330, 61.948 330 C 61.641 330, 56.368 335.089, 50.231 341.310 M 43.271 421.250 C 31.189 433.412, 28.916 433.412, 32.539 447.782 C 34.572 452.694, 58.239 476.622, 63.500 479.084 C 72.572 483.330, 78.936 480.833, 91.486 468.102 L 100.471 458.987 76.994 435.494 C 64.081 422.572, 53.278 412, 52.988 412 C 52.698 412, 48.325 416.163, 43.271 421.250"/>
          </svg>
        </div>
          <h1 class="text-3xl font-black" style="font-family: Impact, 'Arial Black', sans-serif; letter-spacing: -0.05em;">
            <span class="text-white">PT</span><span class="text-orange-500">TRACKER</span>
          </h1>
        </div>
      `;
    }

    function renderPage(page) {
      switch(page) {
        case 'today': return renderTodayPage();
        case 'habits': return renderHabitsPage();
        case 'stats': return renderStatsPage();
        case 'settings': return renderSettingsPage();
        default: return '';
      }
    }

    function renderTodayPage() {
      const todayExercises = getTodaysExercises();
      const grouped = groupByBodyPart(todayExercises);
      const completed = todayExercises.filter(ex => getCompletedSets(ex.id) === (ex.sets || 1)).length;
      const total = todayExercises.length;
      const completionRate = total > 0 ? Math.round((completed / total) * 100) : 0;

      return `
        <div class="mb-2 text-gray-400 text-sm">TODAY'S PLAN</div>
        <div class="flex justify-between items-start mb-6">
          <h1 class="text-3xl font-bold">${getToday()}</h1>
          <div class="text-right">
            <div class="text-3xl font-bold text-orange-500">${completed}/${total}</div>
            <div class="text-sm text-gray-400 font-bold uppercase tracking-wider">Completed</div>
          </div>
        </div>
        <div class="h-2 bg-gray-800 rounded-full mb-8">
          <div class="h-2 bg-orange-500 rounded-full transition-all" style="width: ${completionRate}%"></div>
        </div>
        ${total === 0 ? `
          <div class="text-center py-16">
            <div class="w-32 h-32 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-6 text-5xl">💤</div>
            <h2 class="text-3xl font-bold mb-4">REST DAY?</h2>
            <p class="text-gray-400 text-lg">No exercises scheduled for today.</p>
          </div>
        ` : Object.entries(grouped).map(([bodyPart, exs]) => {
          const isCollapsed = state.collapsedCategories[bodyPart];
          return `
          <div class="pb-6 border-b border-white/20 last:border-b-0 last:pb-0 mb-4">
            <button onclick="toggleCategory('${bodyPart}')" class="w-full flex items-center justify-between mb-3">
              <h2 class="font-bold text-lg uppercase tracking-wide text-white">${bodyPart}</h2>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="transform transition-transform ${isCollapsed ? '' : 'rotate-180'}">
                <path d="M6 9L12 15L18 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="space-y-4 ${isCollapsed ? 'hidden' : ''}">
              ${exs.map(ex => renderTodayExercise(ex)).join('')}
            </div>
          </div>
        `;
        }).join('')}
      `;
    }

    function renderTodayExercise(ex) {
      const completedSets = getCompletedSets(ex.id);
      const totalSets = ex.sets || 1;
      const progress = (completedSets / totalSets) * 100;
      const isComplete = completedSets === totalSets;

      return `
        <div class="p-6 rounded-2xl transition-all cursor-pointer relative overflow-hidden ${
          isComplete ? 'bg-orange-500/20 border-2 border-orange-500' : 'bg-gray-800 border-2 border-transparent'
        }" onclick="toggleComplete(${ex.id}, ${totalSets})">
          ${ex.icon ? `<div class="absolute inset-0 flex items-center justify-center opacity-20 text-orange-500 pointer-events-none"><div class="w-40 h-40">${ex.icon}</div></div>` : ''}
          ${totalSets > 1 ? `
            <div class="absolute inset-0 pointer-events-none overflow-hidden">
              <div class="h-full transition-all duration-300" style="width: ${progress}%; background: rgba(249, 115, 22, 0.3);"></div>
            </div>
          ` : ''}
          <div class="relative z-10">
            <div class="flex justify-between items-start mb-2">
              <h3 class="text-xl font-bold">${ex.name}</h3>
              <div class="text-orange-500 font-bold text-lg">${ex.reps} reps${totalSets > 1 ? ` × ${totalSets}` : ''}</div>
            </div>
            ${ex.description ? `<p class="text-gray-400 text-sm whitespace-pre-wrap">${ex.description}</p>` : ''}
          </div>
          ${totalSets > 1 ? `
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
              <div class="text-5xl font-black text-orange-500" style="text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);">${completedSets}/${totalSets}</div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderHabitsPage() {
      const grouped = groupByBodyPart(state.exercises);
      return `
        <div class="flex justify-between items-center mb-8">
          <h1 class="text-3xl font-bold uppercase tracking-tight">All Exercises</h1>
          <button onclick="openAddModal()" class="px-6 py-3 bg-gray-800 rounded-xl font-bold border border-white/5 active:bg-gray-700">+ New</button>
        </div>
        ${state.exercises.length === 0 ? `<p class="text-center text-gray-400 py-16">No exercises yet.</p>` : 
        Object.entries(grouped).map(([bodyPart, exs]) => `
          <div class="mb-6">
            <h2 class="text-white font-bold text-sm uppercase tracking-widest mb-4 opacity-50">${bodyPart}</h2>
            <div class="space-y-4">${exs.map(ex => renderHabitCard(ex)).join('')}</div>
          </div>
        `).join('')}
      `;
    }

    function renderHabitCard(ex) {
      return `
        <div class="p-4 bg-gray-800 rounded-2xl relative overflow-hidden group">
          ${ex.icon ? `<div class="absolute -bottom-4 -right-4 w-32 h-32 text-orange-500 opacity-10 pointer-events-none bg-transparent">${ex.icon}</div>` : ''}
          <button onclick="deleteExercise(${ex.id})" class="absolute top-3 right-3 p-1 text-gray-400 hover:text-red-500 z-20">✕</button>
          <div class="relative z-10">
            <h3 class="text-xl font-black uppercase ${ex.shelved ? 'text-cyan-400' : 'text-white'}" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">${ex.name}</h3>
            <div class="flex justify-center my-3"><div class="text-orange-500 font-bold text-lg">${ex.reps} reps${ex.sets > 1 ? ` × ${ex.sets}` : ''}</div></div>
            ${ex.description ? `<p class="text-gray-400 text-xs mb-3 whitespace-pre-wrap">${ex.description}</p>` : ''}
            <div class="flex justify-between items-center">
              <div class="flex gap-1">${ex.days.map(day => `<span class="px-2 py-0.5 bg-gray-700 rounded-lg text-xs">${day}</span>`).join('')}</div>
              <button onclick="editExercise(${ex.id})" class="text-orange-500 text-xs font-bold px-2 py-1 hover:bg-gray-700 rounded-lg">Edit</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderStatsPage() {
      const todayExercises = getTodaysExercises();
      const fullyCompleted = todayExercises.filter(ex => getCompletedSets(ex.id) === (ex.sets || 1)).length;
      const totalPossible = todayExercises.length;
      const completionRate = totalPossible > 0 ? Math.round((fullyCompleted / totalPossible) * 100) : 0;

      return `
        <h1 class="text-3xl font-bold mb-8 uppercase tracking-tight">Your Progress</h1>
        <div class="grid grid-cols-2 gap-4 mb-8">
          <div class="p-6 bg-gray-800 rounded-2xl border border-white/5">
            <div class="w-12 h-12 bg-orange-900/50 rounded-full flex items-center justify-center mb-4">
              <svg viewBox="0 0 24 24" fill="none" class="w-7 h-7 stroke-orange-500"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2" stroke-linecap="round"/></svg>
            </div>
            <div class="text-3xl font-black text-white">${fullyCompleted}/${totalPossible}</div>
            <div class="text-xs text-gray-400 font-bold uppercase tracking-wider">Completed Today</div>
          </div>
          <div class="p-6 bg-gray-800 rounded-2xl border border-white/5">
            <div class="w-12 h-12 bg-yellow-900/50 rounded-full flex items-center justify-center mb-4 text-xl">🏆</div>
            <div class="text-3xl font-black text-white">0</div>
            <div class="text-xs text-gray-400 font-bold uppercase tracking-wider">Perfect Days</div>
          </div>
        </div>
        <div class="p-6 bg-gray-800 rounded-3xl border border-white/5">
          <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-6">Overview</h2>
          <div class="space-y-4">
            <div class="flex justify-between items-center py-3 border-b border-gray-700/50">
              <span class="text-gray-400 font-medium">Active Exercises</span>
              <span class="text-2xl font-black">${state.exercises.filter(ex => !ex.shelved).length} of ${state.exercises.length}</span>
            </div>
            <div class="flex justify-between items-center py-3">
              <span class="text-gray-400 font-medium">Completion Rate</span>
              <span class="text-2xl font-black text-orange-500">${completionRate}%</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderSettingsPage() {
      return `
        <div class="p-6 space-y-6">
          <h2 class="text-2xl font-bold text-white uppercase tracking-tight">Settings</h2>
          <div class="space-y-4">
            <button onclick="exportDataAsFile()" class="w-full py-4 bg-gray-800 rounded-xl font-bold border border-white/5">Backup (Download JSON)</button>
            <label class="w-full py-4 bg-orange-500/10 border border-orange-500 text-orange-500 rounded-xl font-bold flex items-center justify-center cursor-pointer">
              Restore (Import JSON) <input type="file" accept=".json" onchange="handleImport(event)" class="hidden">
            </label>
          </div>
        </div>
      `;
    }

    function renderAddModal() {
      const { newExercise, editingExercise } = state;
      return `
        <div class="pb-10 space-y-6">
          <div class="flex items-center justify-between"><h2 class="text-2xl font-bold uppercase">${editingExercise ? 'Edit' : 'New'} Exercise</h2><button onclick="closeAddModal()" class="p-2 text-gray-400">✕</button></div>
          <div><label class="block text-sm text-gray-400 mb-2">Name</label><input type="text" id="exerciseName" value="${newExercise.name}" class="w-full bg-gray-700 rounded-xl px-4 py-3 text-white"></div>
          <div class="grid grid-cols-2 gap-4">
            <div><label class="block text-sm text-gray-400 mb-2">Reps</label><input type="number" id="exerciseReps" value="${newExercise.reps}" class="w-full bg-gray-700 rounded-xl px-4 py-3 text-white"></div>
            <div><label class="block text-sm text-gray-400 mb-2">Category</label><button onclick="selectCustomBodyPart()" class="w-full bg-gray-700 rounded-xl px-4 py-3 text-white text-left overflow-hidden whitespace-nowrap">${newExercise.bodyPart}</button></div>
          </div>
          <div><label class="block text-sm text-gray-400 mb-2">Description (Optional)</label><textarea id="exerciseDescription" class="w-full bg-gray-700 rounded-xl px-4 py-3 text-white h-20">${newExercise.description || ''}</textarea></div>
          <div><label class="block text-sm text-gray-400 mb-2">Icon SVG Code</label><textarea id="exerciseIcon" class="w-full bg-gray-700 rounded-xl px-4 py-3 text-white font-mono text-xs h-20">${newExercise.icon || ''}</textarea></div>
          <div>
            <label class="block text-sm text-gray-400 mb-2">Schedule</label>
            <div class="grid grid-cols-7 gap-1">${daysOfWeek.map(day => `<button onclick="toggleDay('${day}')" class="py-3 rounded-lg font-bold text-xs ${newExercise.days.includes(day) ? 'bg-orange-500 text-white' : 'bg-gray-700 text-gray-400'}">${day}</button>`).join('')}</div>
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-2">Sets</label>
            <div class="flex gap-2">${[1,2,3,4,5].map(n => `<button onclick="selectSets(${n})" class="flex-1 py-3 rounded-xl font-bold ${newExercise.sets === n ? 'bg-orange-500' : 'bg-gray-700 text-gray-400'}">${n}</button>`).join('')}</div>
          </div>
          <div class="flex gap-4">
             <button onclick="toggleShelve()" class="flex-1 py-4 rounded-xl font-bold ${newExercise.shelved ? 'bg-cyan-500 text-white' : 'bg-gray-700 text-gray-400'}">${newExercise.shelved ? 'Shelved' : 'Active'}</button>
             <button onclick="addExercise()" class="flex-[2] py-4 bg-orange-500 rounded-xl font-bold text-white shadow-lg shadow-orange-500/20">${editingExercise ? 'Update' : 'Create'}</button>
          </div>
        </div>
      `;
    }

    function renderBottomNav() {
      const { currentPage } = state;
      const navItems = [
        { id: 'today', label: 'Today', icon: '<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>' },
        { id: 'habits', label: 'Habits', icon: '<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>' },
        { id: 'stats', label: 'Stats', icon: '<path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>' },
        { id: 'settings', label: 'Settings', icon: '<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>' }
      ];
      return `
        <div class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-white/5 flex justify-around p-3 z-50">
          ${navItems.map(item => `
            <button onclick="setPage('${item.id}')" class="flex flex-col items-center gap-1 ${state.currentPage === item.id ? 'text-orange-500' : 'text-gray-500'}">
              <svg viewBox="0 0 24 24" fill="none" class="w-6 h-6 stroke-current" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${item.icon}</svg>
              <span class="text-[10px] font-bold uppercase tracking-widest">${item.label}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    function attachEventListeners() {
      const name = document.getElementById('exerciseName');
      const reps = document.getElementById('exerciseReps');
      const desc = document.getElementById('exerciseDescription');
      const icon = document.getElementById('exerciseIcon');
      if (name) name.oninput = (e) => state.newExercise.name = e.target.value;
      if (reps) reps.oninput = (e) => state.newExercise.reps = e.target.value;
      if (desc) desc.oninput = (e) => state.newExercise.description = e.target.value;
      if (icon) icon.oninput = (e) => state.newExercise.icon = e.target.value;
    }

    window.toggleCategory = (cat) => { state.collapsedCategories[cat] = !state.collapsedCategories[cat]; render(); };
    window.setPage = (p) => setState({ currentPage: p });
    window.openAddModal = () => setState({ showAddModal: true, editingExercise: null, newExercise: { name:'', reps:'', description:'', days:[], sets:1, bodyPart:'Upper Body', icon:'', shelved:false }});
    window.closeAddModal = () => setState({ showAddModal: false });
    window.toggleDay = (d) => { state.newExercise.days = state.newExercise.days.includes(d) ? state.newExercise.days.filter(x => x!==d) : [...state.newExercise.days, d]; render(); };
    window.selectSets = (n) => { state.newExercise.sets = n; render(); };
    window.toggleShelve = () => { state.newExercise.shelved = !state.newExercise.shelved; render(); };
    window.selectCustomBodyPart = () => { const custom = prompt('Enter custom body part:'); if (custom && custom.trim()) { state.newExercise.bodyPart = custom.trim(); render(); } };
    window.editExercise = (id) => { const ex = state.exercises.find(x => x.id === id); if(ex) setState({ editingExercise: ex, newExercise: { ...ex, reps: ex.reps.toString() }, showAddModal: true }); };
    window.deleteExercise = (id) => { if(confirm('Delete?')) saveExercises(state.exercises.filter(x => x.id !== id)); };
    window.toggleComplete = toggleComplete;
    window.exportDataAsFile = () => { const data = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state)); const a = document.createElement('a'); a.href = data; a.download = 'pt_tracker_backup.json'; a.click(); };
    window.handleImport = (e) => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = (ev) => { try { const d = JSON.parse(ev.target.result); state = {...state, ...d}; storage.save('pt-exercises', state.exercises); storage.save('pt-completions', state.completions); render(); alert('Import successful!'); } catch(err) { alert('Import failed.'); } }; r.readAsText(f); };

    checkAndResetDailyData();
    render();
</script>
  
</body>
</html>
