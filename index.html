<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PT Tracker">
  <title>PT Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.263.1/lucide.min.css">
  <style>
    body {
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body class="bg-gray-900 text-white">
  <div id="app">
    <div class="min-h-screen bg-gray-900 flex items-center justify-center">
      <div class="text-gray-400">Loading...</div>
    </div>
  </div>

  <script>
    const APP_VERSION = 'v1.0-github';
    
    // Storage utilities
    const storage = {
      save: (key, value) => {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          console.log('Saved:', key);
          return true;
        } catch (e) {
          console.error('Storage error:', e);
          return false;
        }
      },
      load: (key) => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : null;
        } catch (e) {
          console.error('Load error:', e);
          return null;
        }
      }
    };

    // Simple state management
    let state = {
      currentPage: 'today',
      exercises: storage.load('pt-exercises') || [],
      completions: storage.load('pt-completions') || {},
      collapsedCategories: {},
      showAddModal: false,
      editingExercise: null,
      newExercise: {
        name: '',
        reps: '',
        description: '',
        days: [],
        sets: 1,
        bodyPart: 'Upper Body'
      }
    };

    const bodyPartOptions = ['Upper Body', 'Lower Body', 'Abs', 'Wrist', 'Knee', 'Neck', 'Glutes'];
    const daysOfWeek = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    function setState(updates) {
      state = { ...state, ...updates };
      render();
    }

    function saveExercises(exercises) {
      storage.save('pt-exercises', exercises);
      setState({ exercises });
    }

    function saveCompletions(completions) {
      storage.save('pt-completions', completions);
      setState({ completions });
    }

    function getDateKey() {
      return new Date().toISOString().split('T')[0];
    }

    function getTodayShort() {
      return new Date().toLocaleDateString('en-US', { weekday: 'short' });
    }

    function getToday() {
      return new Date().toLocaleDateString('en-US', { 
        weekday: 'long', 
        month: 'short', 
        day: 'numeric' 
      }).toUpperCase();
    }

    function getTodaysExercises() {
      const todayShort = getTodayShort();
      return state.exercises.filter(ex => ex.days.includes(todayShort));
    }

    function groupByBodyPart(exercises) {
      const grouped = {};
      exercises.forEach(ex => {
        const part = ex.bodyPart || 'Other';
        if (!grouped[part]) grouped[part] = [];
        grouped[part].push(ex);
      });
      return grouped;
    }

    function getCompletedSets(exerciseId) {
      return state.completions[`${exerciseId}-${getDateKey()}`] || 0;
    }

    function toggleComplete(exerciseId, totalSets) {
      const key = `${exerciseId}-${getDateKey()}`;
      const current = state.completions[key] || 0;
      const next = (current + 1) % (totalSets + 1);
      
      const newCompletions = { ...state.completions };
      if (next === 0) {
        delete newCompletions[key];
      } else {
        newCompletions[key] = next;
      }
      saveCompletions(newCompletions);
    }

    function addExercise() {
      const { newExercise, editingExercise, exercises } = state;
      
      if (!newExercise.name || !newExercise.reps || (newExercise.days.length === 0 && !newExercise.shelved)) {
        alert('Please fill in all required fields');
        return;
      }

      if (editingExercise) {
        const updated = exercises.map(ex =>
          ex.id === editingExercise.id
            ? { ...newExercise, id: editingExercise.id, reps: parseInt(newExercise.reps), shelved: newExercise.shelved || false }
            : ex
        );
        saveExercises(updated);
      } else {
        const exercise = {
          id: Date.now(),
          ...newExercise,
          reps: parseInt(newExercise.reps),
          shelved: newExercise.shelved || false
        };
        saveExercises([...exercises, exercise]);
      }

      setState({
        showAddModal: false,
        editingExercise: null,
        newExercise: {
          name: '',
          reps: '',
          description: '',
          days: [],
          sets: 1,
          bodyPart: 'Upper Body'
        }
      });
    }

    function exportData() {
      const headers = ['Name', 'Reps', 'Sets', 'Description', 'Days', 'BodyPart'].join('\t');
      const rows = state.exercises.map(ex => [
        ex.name,
        ex.reps,
        ex.sets || 1,
        (ex.description || '').replace(/\t/g, ' ').replace(/\n/g, ' '),
        ex.days.join(','),
        ex.bodyPart || 'Other'
      ].join('\t'));
      return [headers, ...rows].join('\n');
    }

    function importData(text) {
      try {
        const lines = text.split('\n').filter(line => line.trim());
        if (lines.length < 2) return false;

        const imported = lines.slice(1).map((line, idx) => {
          let values = line.split('\t');
          
          if (values.length < 6) {
            const match = line.match(/^(.+?)\s+(\d+)\s+(\d+)\s+(.+?)\s+((?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)(?:,(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun))*)\s+(.+)$/);
            if (match) values = [match[1], match[2], match[3], match[4], match[5], match[6]];
            else return null;
          }

          return {
            id: Date.now() + Math.random() * 1000 + idx,
            name: values[0].trim(),
            reps: parseInt(values[1]) || 0,
            sets: parseInt(values[2]) || 1,
            description: values[3].trim(),
            days: values[4].split(',').map(d => d.trim()).filter(d => d),
            bodyPart: values[5].trim() || 'Other'
          };
        }).filter(ex => ex !== null && ex.name);

        if (imported.length > 0) {
          saveExercises([...state.exercises, ...imported]);
          return true;
        }
        return false;
      } catch (e) {
        console.error('Import error:', e);
        return false;
      }
    }

    // Render functions
    function render() {
      const app = document.getElementById('app');
      app.innerHTML = renderApp();
      attachEventListeners();
    }

    function renderApp() {
      const { currentPage, showAddModal } = state;
      
      return `
        <div class="min-h-screen bg-gray-900 text-white pb-24">
          ${renderHeader()}
          <div class="px-6">
            ${showAddModal ? renderAddModal() : renderPage(currentPage)}
          </div>
          ${renderBottomNav()}
        </div>
      `;
    }

    function renderHeader() {
      return `
        <div class="p-6 flex items-center gap-4">
         <div class="w-16 h-16 bg-orange-500 rounded-2xl flex items-center justify-center shadow-lg">
  <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 512 512" fill="white">

335.089, 50.231 341.310 M 43.271 421.250 C 31.189 433.412, 28.916 439.029, 32.539 447.782 C 34.572 452.694, 58.239 476.622, 63.500 479.084 C 72.572 483.330, 78.936 480.833, 91.486 468.102 L 100.471 458.987 76.994 435.494 C 64.081 422.572, 53.278 412, 52.988 412 C 52.698 412, 48.325 416.163, 43.271 421.250"/>
  </svg>
</div>
          <h1 class="text-3xl font-black" style="font-family: Impact, 'Arial Black', sans-serif; letter-spacing: -0.05em;">
            <span class="text-white">PT</span><span class="text-orange-500">TRACKER</span>
          </h1>
        </div>
      `;
    }

    function renderPage(page) {
      switch(page) {
        case 'today': return renderTodayPage();
        case 'habits': return renderHabitsPage();
        case 'stats': return renderStatsPage();
        case 'settings': return renderSettingsPage();
        default: return '';
      }
    }

    function renderTodayPage() {
      const todayExercises = getTodaysExercises();
      const grouped = groupByBodyPart(todayExercises);
      const completed = todayExercises.filter(ex => {
        const sets = getCompletedSets(ex.id);
        return sets === (ex.sets || 1);
      }).length;
      const completionRate = todayExercises.length > 0 
        ? Math.round((completed / todayExercises.length) * 100)
        : 0;

      return `
        <div class="mb-2 text-gray-400 text-sm">TODAY'S PLAN</div>
        <div class="flex justify-between items-start mb-6">
          <h1 class="text-3xl font-bold">${getToday()}</h1>
          <div class="text-right">
            <div class="text-3xl font-bold text-orange-500">${completed}/${todayExercises.length}</div>
            <div class="text-sm text-gray-400">Completed</div>
          </div>
        </div>
        <div class="h-2 bg-gray-800 rounded-full mb-8">
          <div class="h-2 bg-orange-500 rounded-full transition-all" style="width: ${completionRate}%"></div>
        </div>
        ${todayExercises.length === 0 ? `
          <div class="text-center py-16">
            <div class="w-32 h-32 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-6 text-5xl">💤</div>
            <h2 class="text-3xl font-bold mb-4">REST DAY?</h2>
            <p class="text-gray-400 text-lg">No exercises scheduled for today.</p>
          </div>
        ` : Object.entries(grouped).map(([bodyPart, exs]) => {
          const isCollapsed = state.collapsedCategories[bodyPart];
          const allCompleted = exs.every(ex => getCompletedSets(ex.id) === (ex.sets || 1));
          return `
          <div class="pb-6 border-b border-white/20 last:border-b-0 last:pb-0 mb-4">
            <button onclick="toggleCategory('${bodyPart}')" class="w-full flex items-center justify-between mb-3 text-left">
              <h2 class="font-bold text-lg uppercase tracking-wide ${allCompleted ? 'text-orange-500' : 'text-white'}">${bodyPart}</h2>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" 
                   class="transform transition-transform ${isCollapsed ? '' : 'rotate-180'}">
                <path d="M6 9L12 15L18 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="space-y-4 ${isCollapsed ? 'hidden' : ''}">
              ${exs.map(ex => renderTodayExercise(ex)).join('')}
            </div>
          </div>
        `;
        }).join('')}
      `;
    }

function renderTodayExercise(ex) {
      const completedSets = getCompletedSets(ex.id);
      const totalSets = ex.sets || 1;
      const progress = (completedSets / totalSets) * 100;
      const isComplete = completedSets === totalSets;

      return `
    <div 
      class="p-6 rounded-2xl transition-all cursor-pointer relative overflow-hidden ${
        isComplete ? 'bg-orange-500/20 border-2 border-orange-500' : 'bg-gray-800 border-2 border-transparent'
      }"
      onclick="toggleComplete(${ex.id}, ${totalSets})"
    >
      ${totalSets > 1 ? `
        <div class="absolute inset-0 pointer-events-none overflow-hidden">
          <div class="h-full transition-all duration-300" style="
            width: ${progress}%;
            background: ${progress === 100 
              ? 'rgba(249, 115, 22, 0.3)' 
              : 'linear-gradient(to right, rgba(249, 115, 22, 0.3) 0%, rgba(249, 115, 22, 0.3) 85%, rgba(249, 115, 22, 0) 100%)'
            };
          "></div>
        </div>
      ` : ''}
      <div class="relative z-10">
        <div class="flex justify-between items-start mb-2">
          <h3 class="text-xl font-bold">${ex.name}</h3>
          <div class="text-orange-500 font-bold text-lg">${ex.reps} reps${totalSets > 1 ? ` × ${totalSets}` : ''}</div>
        </div>
        ${ex.description ? `<p class="text-gray-400 text-sm whitespace-pre-wrap">${ex.description}</p>` : ''}
      </div>
      ${totalSets > 1 ? `
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
          <div class="text-5xl font-black text-orange-500" 
               style="text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), 0 0 20px rgba(249, 115, 22, 0.3);">
            ${completedSets}/${totalSets}
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

    function renderHabitsPage() {
      const grouped = groupByBodyPart(state.exercises);
      
      return `
        <div class="flex justify-between items-center mb-8">
          <h1 class="text-3xl font-bold">ALL EXERCISES</h1>
          <button onclick="openAddModal()" class="px-6 py-3 bg-gray-800 rounded-xl font-bold flex items-center gap-2">
            + New
          </button>
        </div>
        ${state.exercises.length === 0 ? `
          <div class="text-center py-16 text-gray-400">
            <p class="text-lg">No exercises yet. Add your first one!</p>
          </div>
        ` : Object.entries(grouped).map(([bodyPart, exs]) => {
          const isCollapsed = state.collapsedCategories[`habits-${bodyPart}`];
          return `
          <div class="pb-6 border-b border-white/20 last:border-b-0 last:pb-0 mb-4">
            <button onclick="toggleCategory('habits-${bodyPart}')" class="w-full flex items-center justify-between mb-3 text-left">
              <h2 class="text-white font-bold text-lg uppercase tracking-wide">${bodyPart}</h2>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" 
                   class="transform transition-transform ${isCollapsed ? '' : 'rotate-180'}">
                <path d="M6 9L12 15L18 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="space-y-4 ${isCollapsed ? 'hidden' : ''}">
              ${exs.map(ex => renderHabitCard(ex)).join('')}
            </div>
          </div>
        `;
        }).join('')}
      `;
    }

    function renderHabitCard(ex) {
      return `
        <div class="p-4 bg-gray-800 rounded-2xl relative" data-exercise-id="${ex.id}">
          <button onclick="deleteExercise(${ex.id})" class="absolute top-3 right-3 p-1 text-gray-400 hover:text-red-500 transition-colors">✕</button>
          <div class="flex justify-between items-start mb-1 pr-7">
            <h3 class="text-xl font-black uppercase tracking-wide ${ex.shelved ? 'text-cyan-400' : 'text-white'}" style="text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); letter-spacing: 0.05em;">
              ${ex.name}
            </h3>
          </div>
          <div class="flex justify-center my-2">
            <div class="text-orange-500 font-bold text-lg">${ex.reps} reps${ex.sets > 1 ? ` × ${ex.sets}` : ''}</div>
          </div>
          ${ex.description ? `<p class="text-gray-400 text-xs mb-2 whitespace-pre-wrap">${ex.description}</p>` : ''}
          <div class="flex justify-between items-center">
            <div class="flex gap-1">
              ${ex.days.map(day => `<span class="px-2 py-0.5 bg-gray-700 rounded-lg text-xs">${day}</span>`).join('')}
            </div>
            <button onclick="editExercise(${ex.id})" class="text-orange-500 text-xs font-bold px-2 py-1 hover:bg-gray-700 rounded-lg transition-colors">
              Edit
            </button>
          </div>
        </div>
      `;
    }

   function renderStatsPage() {
  const todayExercises = getTodaysExercises();
  const totalRepsNeeded = todayExercises.reduce((sum, ex) => sum + (ex.reps * (ex.sets || 1)), 0);
  const totalRepsCompleted = todayExercises.reduce((sum, ex) => {
    return sum + (ex.reps * getCompletedSets(ex.id));
  }, 0);
  const completed = todayExercises.filter(ex => getCompletedSets(ex.id) === (ex.sets || 1)).length;
  const completionRate = todayExercises.length > 0 ? Math.round((completed / todayExercises.length) * 100) : 0;

  return `
    <h1 class="text-3xl font-bold mb-8 uppercase tracking-tight">Your Progress</h1>
    <div class="grid grid-cols-2 gap-4 mb-8">
      <div class="p-6 bg-gray-800 rounded-2xl border border-white/5">
        <div class="w-12 h-12 bg-orange-900/50 rounded-full flex items-center justify-center mb-4">
          <svg viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 stroke-orange-500">
            <path d="M12.5 8V12.5L15.5 15.5M20.5 12.5C20.5 16.9183 16.9183 20.5 12.5 20.5C8.08172 20.5 4.5 16.9183 4.5 12.5C4.5 8.08172 8.08172 4.5 12.5 4.5C16.9183 4.5 20.5 8.08172 20.5 12.5Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="text-3xl font-black text-white">${totalRepsCompleted}/${totalRepsNeeded}</div>
        <div class="text-xs text-gray-400 font-bold uppercase tracking-wider">Total Reps Today</div>
      </div>
      
      <div class="p-6 bg-gray-800 rounded-2xl border border-white/5">
        <div class="w-12 h-12 bg-yellow-900/50 rounded-full flex items-center justify-center mb-4 text-xl">🏆</div>
        <div class="text-3xl font-black text-white">0</div>
        <div class="text-xs text-gray-400 font-bold uppercase tracking-wider">Perfect Days</div>
      </div>
    </div>

    <div class="p-6 bg-gray-800 rounded-3xl border border-white/5">
      <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-6">Overview</h2>
      <div class="space-y-4">
        <div class="flex justify-between items-center py-3 border-b border-gray-700/50">
          <span class="text-gray-400 font-medium">Active Exercises</span>
          <span class="text-2xl font-black">${state.exercises.length}</span>
        </div>
        <div class="flex justify-between items-center py-3">
          <span class="text-gray-400 font-medium">Completion Rate</span>
          <span class="text-2xl font-black text-orange-500">${completionRate}%</span>
        </div>
      </div>
    </div>
  `;
}

    function renderSettingsPage() {
  return `
    <div class="p-6 pb-24 animate-fade-in">
      <h2 class="text-2xl font-bold mb-6 text-white">Settings</h2>
      
      <div class="space-y-6">
        <section class="bg-gray-800 rounded-2xl p-5 border border-gray-700 shadow-xl">
          <div class="flex items-center gap-3 mb-5">
            <div class="p-2 bg-orange-500/20 rounded-lg">
              <span class="text-orange-500">💾</span>
            </div>
            <h3 class="text-lg font-semibold text-white">Data Management</h3>
          </div>
          
          <div class="grid grid-cols-1 gap-4">
            <button onclick="copyDataToClipboard()" 
              class="group w-full py-4 bg-gray-700/50 hover:bg-gray-700 rounded-xl font-medium transition-all flex items-center justify-between px-5 border border-gray-600">
              <div class="flex items-center gap-3">
                <span class="text-xl">📋</span>
                <span class="text-gray-200">Copy to Clipboard</span>
              </div>
              <span class="text-xs text-gray-400 font-mono uppercase tracking-widest group-hover:text-orange-500">JSON</span>
            </button>
            
            <button onclick="exportDataAsFile()" 
              class="w-full py-4 bg-gray-700/50 hover:bg-gray-700 rounded-xl font-medium transition-all flex items-center gap-3 px-5 border border-gray-600">
              <span class="text-xl">📥</span>
              <span class="text-gray-200">Download Backup</span>
            </button>

            <label class="w-full py-4 bg-orange-500/10 border border-orange-500/30 text-orange-500 hover:bg-orange-500 hover:text-white rounded-xl font-bold transition-all flex items-center justify-center gap-3 cursor-pointer shadow-lg shadow-orange-500/5">
              <span class="text-xl">📤</span>
              <span>Import JSON File</span>
              <input type="file" accept=".json" onchange="handleImport(event)" class="hidden">
            </label>
          </div>
          
          <div class="mt-6 p-4 bg-gray-900/50 rounded-lg border border-gray-700/50">
            <p class="text-[11px] text-gray-500 uppercase font-bold tracking-wider mb-1">Warning</p>
            <p class="text-xs text-gray-400 leading-relaxed">
              Importing a file will <strong>permanently overwrite</strong> your current habits and progress. 
              Always download a backup before importing.
            </p>
          </div>
        </section>
        
        <div class="text-center pt-4">
          <p class="text-xs text-gray-600">Version 1.2.0 • Data is stored locally</p>
        </div>
      </div>
    </div>
  `;
}

    function renderAddModal() {
      const { newExercise, editingExercise } = state;
      
      return `
        <div class="pb-4">

async function copyDataToClipboard() {
  const dataString = JSON.stringify(state, null, 2);
  try {
    await navigator.clipboard.writeText(dataString);
    alert('Data copied to clipboard! Save it in a safe place.');
  } catch (err) {
    alert('Failed to copy data. Please try again.');
  }
}

function exportDataAsFile() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
  const downloadAnchorNode = document.createElement('a');
  downloadAnchorNode.setAttribute("href", dataStr);
  downloadAnchorNode.setAttribute("download", `habit_tracker_backup_${new Date().toISOString().split('T')[0]}.json`);
  document.body.appendChild(downloadAnchorNode);
  downloadAnchorNode.click();
  downloadAnchorNode.remove();
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const importedData = JSON.parse(e.target.result);
      
      // We check for YOUR specific keys: exercises and completions
      if (importedData.exercises && importedData.completions) {
        if (confirm('This will overwrite your current habits and progress. Are you sure?')) {
          state = { ...state, ...importedData };
          
          // Save using your existing storage utilities
          storage.save('pt-exercises', state.exercises);
          storage.save('pt-completions', state.completions);
          
          render(); // Refresh the UI
          alert('Import successful!');
        }
      } else {
        alert('Invalid backup file format. Could not find exercises or completions.');
      }
    } catch (err) {
      alert('Error reading file. Make sure it is a valid JSON backup.');
    }
  };
  reader.readAsText(file);
}
